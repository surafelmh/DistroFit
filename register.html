<html>
    <head>
        <title>Signup</title>
    </head>
    <h1>
        Register
    </h1>
    <body>
        <h2>Signup Form</h2>
        <form action="/signup" method="POST">
            <label for="fname">First Name</label><br>
            <input type="text" name="fname" id="fname" size="40"/><br>
            <label for="lname">Last Name</label><br>
            <input type="text" name="lname" id="lname" size="40"/><br>
            <label for="userName">Username</label><br>
            <input type="text" name="userName" id="userName" size="20"/><br>
            <label for="password">Password</label><br>
            <input type="password" name="password" id="password" size="30"/><br>
            <input type="submit" value="Submit"/>
        </form>
    </body>         
</html>
