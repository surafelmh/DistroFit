<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 2rem;
            background-color: #2E3440;
            color: #ECEFF4;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .card {
            background-color: #3B4252;
            padding: 2.5rem;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #4C566A;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #ECEFF4;
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .badge {
            display: inline-block;
            background-color: #434C5E;
            color: #D08770;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            border: 1px solid #4C566A;
        }
        p {
            color: #D8DEE9;
            line-height: 1.6;
            font-size: 0.95rem;
            margin: 0 0 1.5rem 0;
        }
        a.btn-login {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background-color: #88C0D0;
            color: #2E3440;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
        }
        a.btn-login:hover {
            background-color: #81A1C1;
        }
        a.btn-login:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Logged Out</h2>
        <span class="badge">Session Ended</span>
        <a class="btn-login" href="/login.html">Sign In Again</a>
    </div>
</body>
</html>
